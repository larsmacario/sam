name: Sam
options:
  bundleIdPrefix: de.larsmacario
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
schemes:
  Sam:
    build:
      targets:
        Sam: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: "1.0.0"
targets:
  Sam:
    type: application
    platform: macOS
    sources:
      - path: Sam
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.larsmacario.sam
        PRODUCT_NAME: SAM
        INFOPLIST_FILE: Sam/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sam/Sam.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - sdk: AppKit.framework
      - sdk: AVFoundation.framework
      - sdk: Speech.framework
      - sdk: Carbon.framework
      - package: WhisperKit
        product: WhisperKit
    entitlements:
      path: Sam/Sam.entitlements
      properties:
        com.apple.security.device.audio-input: true
