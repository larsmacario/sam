name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      SIGN_RELEASE: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
      UPLOAD_BLOB: ${{ secrets.BLOB_READ_WRITE_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -scheme Sam -project Sam.xcodeproj

      - name: Import signing certificate
        if: env.SIGN_RELEASE == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH"

      - name: Build Release (unsigned)
        if: env.SIGN_RELEASE != 'true'
        run: |
          xcodebuild \
            -scheme Sam \
            -project Sam.xcodeproj \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Release (signed)
        if: env.SIGN_RELEASE == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -scheme Sam \
            -project Sam.xcodeproj \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            build

      - name: Package SAM.dmg
        run: |
          APP_PATH="DerivedData/Build/Products/Release/SAM.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "SAM.app not found at $APP_PATH"
            exit 1
          fi
          chmod +x Scripts/create-dmg.sh
          ./Scripts/create-dmg.sh "$APP_PATH" SAM.dmg
          ls -la SAM.dmg

      - name: Notarize release
        if: env.SIGN_RELEASE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit SAM.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple SAM.dmg

      - name: Setup Node
        if: env.UPLOAD_BLOB == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Upload to Vercel Blob
        if: env.UPLOAD_BLOB == 'true'
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          cd website && npm ci
          node scripts/upload-release-to-blob.mjs ../SAM.dmg "${GITHUB_REF_NAME#v}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SAM.dmg
          generate_release_notes: true
